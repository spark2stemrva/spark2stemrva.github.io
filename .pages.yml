media:
  input: images/workshops
  output: /images/workshops
content:
  - name: workshops
    label: Workshops
    type: file
    path: data/workshops.json
    format: json
    fields:
      - name: workshops
        label: Workshops
        type: object
        list: true
        fields:
          - {name: title, label: Title, type: string}
          - {name: date, label: Date / schedule, type: string}
          - {name: description, label: Description, type: text}
          - {name: image, label: Picture, type: image}
          - name: tags
            label: Subjects
            type: select
            options:
              multiple: true
              values: [Science, Technology, Engineering, Math]
          - name: image_position
            label: Picture position (which part shows on the card)
            type: select
            options:
              values:
                - {value: "0%", label: Top}
                - {value: "25%", label: Upper middle}
                - {value: "50%", label: Center}
                - {value: "75%", label: Lower middle}
                - {value: "100%", label: Bottom}
          - name: image_fit
            label: Picture size
            type: select
            options:
              values:
                - {value: crop, label: Crop to fit the card}
                - {value: whole, label: Show the whole picture}
          - {name: link, label: Sign-up link (optional), type: string}
  - name: links
    label: Sign-Up Links
    type: file
    path: data/site.json
    format: json
    fields:
      - {name: workshopsLink, label: "Sign up for Workshops card link", type: string}
      - {name: classesLink, label: "Join our STEM Classes card link", type: string}
      - {name: signupLink, label: "Workshop Sign-Up card link (your form)", type: string}
